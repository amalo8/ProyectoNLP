<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura de un agente IA aplicada al codigo</title>
  <desc id="desc">Diagrama que relaciona los componentes principales de un sistema de agente IA con clases y funciones del codigo app.py.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 38px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px Arial, Helvetica, sans-serif; fill: #475569; }
      .box { stroke-width: 2.5; rx: 22; filter: url(#shadow); }
      .box-title { font: 700 23px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .box-code { font: 700 18px Consolas, Monaco, monospace; fill: #1d4ed8; }
      .box-text { font: 400 17px Arial, Helvetica, sans-serif; fill: #334155; }
      .small { font: 400 15px Arial, Helvetica, sans-serif; fill: #475569; }
      .arrow { fill: none; stroke: #2563eb; stroke-width: 4; marker-end: url(#arrow); }
      .arrow-soft { fill: none; stroke: #64748b; stroke-width: 3; stroke-dasharray: 8 8; marker-end: url(#arrow); }
      .section { font: 700 16px Arial, Helvetica, sans-serif; fill: #64748b; letter-spacing: 0.6px; }
      .note { fill: #e0f2fe; stroke: #7dd3fc; stroke-width: 1.5; rx: 18; }
    </style>
  </defs>

  <rect class="bg" width="1500" height="980"/>

  <text class="title" x="750" y="62" text-anchor="middle">Arquitectura de un agente IA en este proyecto</text>
  <text class="subtitle" x="750" y="98" text-anchor="middle">Componentes conceptuales y su correspondencia con clases y funciones de app.py</text>

  <text class="section" x="95" y="160">ENTRADA E INTERFAZ</text>
  <text class="section" x="505" y="160">NUCLEO DEL AGENTE</text>
  <text class="section" x="1040" y="160">ACCION Y ENTORNO</text>

  <rect class="box" x="70" y="190" width="330" height="155" fill="#ecfeff" stroke="#06b6d4"/>
  <text class="box-title" x="235" y="232" text-anchor="middle">Interfaz de usuario</text>
  <text class="box-code" x="235" y="267" text-anchor="middle">main()</text>
  <text class="box-text" x="235" y="300" text-anchor="middle">Crea el chatbot con Streamlit</text>
  <text class="small" x="235" y="327" text-anchor="middle">st.chat_input / st.chat_message</text>

  <rect class="box" x="70" y="405" width="330" height="155" fill="#f0fdf4" stroke="#22c55e"/>
  <text class="box-title" x="235" y="447" text-anchor="middle">Entrada del usuario</text>
  <text class="box-code" x="235" y="482" text-anchor="middle">instruccion</text>
  <text class="box-text" x="235" y="515" text-anchor="middle">Texto escrito en el chat</text>
  <text class="small" x="235" y="542" text-anchor="middle">Se envia como {"input": instruccion}</text>

  <rect class="box" x="470" y="190" width="360" height="155" fill="#eff6ff" stroke="#3b82f6"/>
  <text class="box-title" x="650" y="232" text-anchor="middle">Constructor del agente</text>
  <text class="box-code" x="650" y="267" text-anchor="middle">crear_agente()</text>
  <text class="box-text" x="650" y="300" text-anchor="middle">Une modelo, prompt y herramientas</text>
  <text class="small" x="650" y="327" text-anchor="middle">Devuelve un AgentExecutor</text>

  <rect class="box" x="470" y="405" width="360" height="155" fill="#fefce8" stroke="#eab308"/>
  <text class="box-title" x="650" y="447" text-anchor="middle">Modelo de lenguaje</text>
  <text class="box-code" x="650" y="482" text-anchor="middle">ChatOpenAI</text>
  <text class="box-text" x="650" y="515" text-anchor="middle">Cliente compatible con OpenRouter</text>
  <text class="small" x="650" y="542" text-anchor="middle">model=openrouter/free</text>

  <rect class="box" x="470" y="620" width="360" height="155" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text class="box-title" x="650" y="662" text-anchor="middle">Prompt interno</text>
  <text class="box-code" x="650" y="697" text-anchor="middle">ChatPromptTemplate</text>
  <text class="box-text" x="650" y="730" text-anchor="middle">Define instrucciones del sistema</text>
  <text class="small" x="650" y="757" text-anchor="middle">MessagesPlaceholder: agent_scratchpad</text>

  <rect class="box" x="890" y="190" width="360" height="155" fill="#fff7ed" stroke="#f97316"/>
  <text class="box-title" x="1070" y="232" text-anchor="middle">Ejecutor del agente</text>
  <text class="box-code" x="1070" y="267" text-anchor="middle">AgentExecutor</text>
  <text class="box-text" x="1070" y="300" text-anchor="middle">Ejecuta el ciclo del agente</text>
  <text class="small" x="1070" y="327" text-anchor="middle">agente.invoke(...)</text>

  <rect class="box" x="890" y="405" width="360" height="155" fill="#fdf2f8" stroke="#ec4899"/>
  <text class="box-title" x="1070" y="447" text-anchor="middle">Herramienta</text>
  <text class="box-code" x="1070" y="482" text-anchor="middle">@tool actualizar_fichero</text>
  <text class="box-text" x="1070" y="515" text-anchor="middle">Funcion que modifica el fichero</text>
  <text class="small" x="1070" y="542" text-anchor="middle">Recibe ruta, accion y contenido</text>

  <rect class="box" x="890" y="620" width="360" height="155" fill="#f1f5f9" stroke="#64748b"/>
  <text class="box-title" x="1070" y="662" text-anchor="middle">Esquema de argumentos</text>
  <text class="box-code" x="1070" y="697" text-anchor="middle">ActualizarFicheroArgs</text>
  <text class="box-text" x="1070" y="730" text-anchor="middle">Describe parametros de la herramienta</text>
  <text class="small" x="1070" y="757" text-anchor="middle">BaseModel + Field</text>

  <rect class="box" x="1285" y="405" width="170" height="155" fill="#ecfdf5" stroke="#10b981"/>
  <text class="box-title" x="1370" y="447" text-anchor="middle">Entorno</text>
  <text class="box-code" x="1370" y="482" text-anchor="middle">data/</text>
  <text class="box-text" x="1370" y="515" text-anchor="middle">Fichero local</text>
  <text class="small" x="1370" y="542" text-anchor="middle">notas.txt</text>

  <rect class="box" x="1285" y="620" width="170" height="155" fill="#ffe4e6" stroke="#f43f5e"/>
  <text class="box-title" x="1370" y="662" text-anchor="middle">Seguridad</text>
  <text class="box-code" x="1370" y="697" text-anchor="middle">resolver_</text>
  <text class="box-code" x="1370" y="721" text-anchor="middle">ruta_segura()</text>
  <text class="small" x="1370" y="752" text-anchor="middle">Impide salir de data/</text>

  <path class="arrow" d="M235 345 L235 395"/>
  <path class="arrow" d="M400 482 L460 270"/>
  <path class="arrow" d="M830 270 L880 270"/>
  <path class="arrow" d="M1070 345 L1070 395"/>
  <path class="arrow" d="M1250 482 L1275 482"/>
  <path class="arrow-soft" d="M1070 560 L1070 610"/>
  <path class="arrow-soft" d="M1250 697 L1275 697"/>
  <path class="arrow" d="M830 482 L880 482"/>
  <path class="arrow" d="M650 560 L650 610"/>
  <path class="arrow-soft" d="M650 345 L650 395"/>

  <rect class="note" x="135" y="835" width="1230" height="82"/>
  <text class="box-text" x="750" y="866" text-anchor="middle">Idea clave: el agente no es una sola clase escrita a mano.</text>
  <text class="small" x="750" y="895" text-anchor="middle">En crear_agente() se ensamblan modelo + prompt + herramientas, y AgentExecutor ejecuta el ciclo de decision y llamada a herramientas.</text>
</svg>
