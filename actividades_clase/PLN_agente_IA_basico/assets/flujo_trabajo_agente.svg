<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Flujo de trabajo del agente con LangChain, Streamlit y OpenRouter</title>
  <desc id="desc">Diagrama de flujo que muestra como el usuario escribe criterios en Streamlit, el agente de LangChain llama a OpenRouter y usa una herramienta Python para actualizar un fichero local.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 38px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px Arial, Helvetica, sans-serif; fill: #475569; }
      .box { stroke-width: 2.5; rx: 22; filter: url(#shadow); }
      .box-title { font: 700 24px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .box-text { font: 400 18px Arial, Helvetica, sans-serif; fill: #334155; }
      .small { font: 400 15px Arial, Helvetica, sans-serif; fill: #475569; }
      .lane-title { font: 700 18px Arial, Helvetica, sans-serif; fill: #334155; letter-spacing: 0.5px; }
      .arrow { fill: none; stroke: #2563eb; stroke-width: 4; marker-end: url(#arrow); }
      .arrow-soft { fill: none; stroke: #64748b; stroke-width: 3; stroke-dasharray: 8 8; marker-end: url(#arrow); }
      .badge { fill: #dbeafe; stroke: #93c5fd; stroke-width: 1.5; }
      .badge-text { font: 700 15px Arial, Helvetica, sans-serif; fill: #1d4ed8; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="900"/>

  <text class="title" x="700" y="62" text-anchor="middle">Flujo de trabajo del agente</text>
  <text class="subtitle" x="700" y="98" text-anchor="middle">LangChain + Streamlit + OpenRouter + fichero local</text>

  <rect x="70" y="145" width="1260" height="625" rx="30" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>

  <text class="lane-title" x="125" y="190">INTERFAZ</text>
  <text class="lane-title" x="470" y="190">AGENTE</text>
  <text class="lane-title" x="810" y="190">MODELO</text>
  <text class="lane-title" x="1085" y="190">SISTEMA LOCAL</text>

  <rect class="box" x="95" y="225" width="260" height="145" fill="#ecfeff" stroke="#06b6d4"/>
  <text class="box-title" x="225" y="267" text-anchor="middle">Usuario</text>
  <text class="box-text" x="225" y="304" text-anchor="middle">Escribe criterios</text>
  <text class="small" x="225" y="334" text-anchor="middle">Ej: anadir una tarea</text>

  <rect class="box" x="95" y="505" width="260" height="145" fill="#f0fdf4" stroke="#22c55e"/>
  <text class="box-title" x="225" y="547" text-anchor="middle">Streamlit</text>
  <text class="box-text" x="225" y="584" text-anchor="middle">Muestra formulario,</text>
  <text class="box-text" x="225" y="610" text-anchor="middle">respuesta y fichero</text>

  <rect class="box" x="430" y="365" width="285" height="145" fill="#eff6ff" stroke="#3b82f6"/>
  <text class="box-title" x="572" y="407" text-anchor="middle">Agente LangChain</text>
  <text class="box-text" x="572" y="444" text-anchor="middle">Decide si debe usar</text>
  <text class="box-text" x="572" y="470" text-anchor="middle">una herramienta</text>

  <rect class="box" x="785" y="225" width="280" height="145" fill="#fefce8" stroke="#eab308"/>
  <text class="box-title" x="925" y="267" text-anchor="middle">OpenRouter</text>
  <text class="box-text" x="925" y="304" text-anchor="middle">Router de modelos</text>
  <text class="box-text" x="925" y="330" text-anchor="middle">gratuitos</text>

  <rect class="box" x="785" y="505" width="280" height="145" fill="#fff7ed" stroke="#f97316"/>
  <text class="box-title" x="925" y="547" text-anchor="middle">Herramienta Python</text>
  <text class="box-text" x="925" y="584" text-anchor="middle">actualizar_fichero</text>
  <text class="small" x="925" y="614" text-anchor="middle">reemplazar / anadir</text>

  <rect class="box" x="1110" y="505" width="180" height="145" fill="#fdf2f8" stroke="#ec4899"/>
  <text class="box-title" x="1200" y="547" text-anchor="middle">Fichero</text>
  <text class="box-text" x="1200" y="584" text-anchor="middle">data/notas.txt</text>
  <text class="small" x="1200" y="614" text-anchor="middle">solo carpeta data</text>

  <path class="arrow" d="M225 370 L225 492"/>
  <path class="arrow" d="M355 578 C390 578 395 438 425 438"/>
  <path class="arrow" d="M715 438 C755 438 750 298 780 298"/>
  <path class="arrow" d="M925 370 C925 410 925 455 925 500"/>
  <path class="arrow" d="M1065 578 L1105 578"/>
  <path class="arrow-soft" d="M1110 620 C830 760 350 745 250 655"/>

  <rect class="badge" x="420" y="690" width="560" height="48" rx="24"/>
  <text class="badge-text" x="700" y="721" text-anchor="middle">La clave se lee desde .env: OPENROUTER_API_KEY</text>

  <text class="small" x="220" y="405" text-anchor="middle">1. Pulsa ejecutar agente</text>
  <text class="small" x="570" y="340" text-anchor="middle">2. El prompt guia la decision</text>
  <text class="small" x="925" y="405" text-anchor="middle">3. El modelo elige argumentos</text>
  <text class="small" x="1200" y="685" text-anchor="middle">4. Se guarda el cambio</text>
  <text class="small" x="505" y="790" text-anchor="middle">5. Streamlit refresca el contenido actualizado</text>

  <rect x="95" y="805" width="1210" height="50" rx="16" fill="#e0f2fe" stroke="#7dd3fc"/>
  <text class="small" x="700" y="836" text-anchor="middle">Idea clave para clase: el agente no toca el fichero por magia; usa una herramienta Python controlada y limitada.</text>
</svg>
